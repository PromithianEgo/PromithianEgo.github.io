<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>404 — Page Not Found</title>

  <meta
    name="robots"
    content="noindex, nofollow"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  />

  <style>
    :root {
      color-scheme: dark;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #070707;
      color: #f2efe9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(187, 162, 123, 0.08),
          transparent 28%
        ),
        #070707;
    }

    main {
      width: min(680px, 100%);

      text-align: center;
    }

    .code {
      margin-bottom: 20px;

      color: #bba27b;

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(54px, 10vw, 110px);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }

    p {
      max-width: 460px;

      margin:
        28px auto
        34px;

      color: #9d978e;

      font-size: 15px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;

      padding:
        13px 18px;

      border-radius: 999px;

      background: #f2efe9;
      color: #111;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <main>
    <div class="code">
      404 / Not Found
    </div>

    <h1>
      Nothing here.
    </h1>

    <p>
      The page you were looking for does not exist or may have moved.
    </p>

    <a href="/">
      Return to Portfolio
    </a>
  </main>
</body>
</html>
